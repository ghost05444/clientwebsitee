# Build settings only.
#
# Response headers deliberately live in public/_headers, not here. This file is
# read only when Netlify runs the build itself, so rules kept here would be
# silently dropped by a drag-and-drop deploy of the out/ folder — shipping the
# site with no CSP, no HSTS and no caching. public/_headers is copied into the
# build output, so it travels with the site however it is deployed.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
