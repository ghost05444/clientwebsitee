[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Product images and datasheets are content-addressed by filename and only
# change when the catalogue is rebuilt, so they can cache hard.
# (Images live under /media, not /products, so they never shadow the
# /products/* page routes.)
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/datasheets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The search index is regenerated on every catalogue build; revalidate daily.
[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
